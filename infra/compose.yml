services:
  shared-postgres:
    image: postgres:15-alpine
    container_name: shared-postgres
    environment:
      POSTGRES_DB: neoquima_shared
      POSTGRES_USER: neoquima_admin
      POSTGRES_PASSWORD: neoquima_admin_pass_2024
      POSTGRES_MULTIPLE_DATABASES: whatsapp,llm,analytics,auth
    ports: ["5433:5432"]
    volumes:
      - shared_postgres_data:/var/lib/postgresql/data
      - ../services/shared-database/postgres/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U neoquima_admin -d neoquima_shared"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - shared-network

  shared-database-api:
    build: ../services/shared-database
    container_name: shared-database-api
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql://neoquima_admin:neoquima_admin_pass_2024@shared-postgres:5432/neoquima_shared}
      - SECRET_KEY=${SECRET_KEY:-neoquima-secret-key-2024}
      - ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=30
      - DEBUG=false
    depends_on:
      shared-postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - shared-network

  qdrant:
    image: qdrant/qdrant:v1.8.0
    container_name: neoquima-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      - QDRANT__SERVICE__HTTP_PORT=6333
      - QDRANT__SERVICE__GRPC_PORT=6334
    # healthcheck:
    #   test: ["CMD", "curl", "-f", "http://localhost:6333/collections"]
    #   interval: 30s
    #   timeout: 10s
    #   retries: 3
    #   start_period: 40s
    networks:
      - shared-network

  ollama:
    image: ollama/ollama:latest
    container_name: neoquima-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0
    # healthcheck:
    #   test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
    #   interval: 30s
    #   timeout: 10s
    #   retries: 5
    #   start_period: 60s
    networks:
      - shared-network

  llm-service:
    build: ../services/llm-service
    container_name: neoquima-llm-service
    ports:
      - "8003:8003"
    environment:
      - OLLAMA_URL=http://ollama:11434
      - SHARED_DATABASE_URL=http://shared-database-api:8000
      - DEFAULT_MODEL=llama2:3b
    depends_on:
      - ollama
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8003/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - shared-network

  whatsapp-gateway:
    build: ../services/whatsapp-gateway
    environment:
      VERIFY_TOKEN: ${VERIFY_TOKEN:-neoquima_webhook_2024}
      ADMIN_TOKEN: ${ADMIN_TOKEN}
      DATABASE_URL: ${DATABASE_URL:-postgresql://neoquima_admin:neoquima_admin_pass_2024@shared-postgres:5432/neoquima_shared}
      SHARED_DATABASE_URL: http://shared-database-api:8000
      WHATSAPP_TOKEN: ${WHATSAPP_TOKEN}
      WHATSAPP_PHONE_ID: ${WHATSAPP_PHONE_ID}
      # allowlist inicial (opcional). Ex.: +5511999998888,+353831112222
      ALLOWLIST: ""
      # Debug: Salvar payloads LLM em arquivos JSON (false por padrão)
      SAVE_LLM_PAYLOADS: ${SAVE_LLM_PAYLOADS:-false}
    ports: ["8081:8000"]
    depends_on:
      shared-postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - shared-network

  rag-service:
    build: ../services/rag-service
    container_name: neoquima-rag-service
    ports: ["8004:8004"]
    environment:
      - QDRANT_URL=http://qdrant:6333
      - OLLAMA_URL=http://ollama:11434
      - EMBEDDING_MODEL=nomic-embed-text
      - CHUNK_SIZE=1000
      - CHUNK_OVERLAP=200
    depends_on:
      - qdrant
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8004/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - shared-network

  admin-ui:
    build: ../services/admin-ui
    container_name: infra-admin-ui
    ports: ["8080:8080"]
    environment:
      - SHARED_DATABASE_URL=http://shared-database-api:8000
      - SECRET_KEY=${SECRET_KEY:-admin-secret-key-2024}
      - DEBUG=${DEBUG:-false}
      - ADMIN_UI_PORT=8080
    depends_on:
      shared-database-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - shared-network

volumes:
  shared_postgres_data:
  qdrant_data:
  ollama_data:

networks:
  shared-network:
    driver: bridge
